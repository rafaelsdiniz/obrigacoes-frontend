name: obrigacoes_app
description: Aplicativo de gerenciamento de obrigações das empresas clientes de um escritório de contabilidade.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cross_file: ^0.3.5+5
  desktop_drop: ^0.8.0
  dio: ^5.11.1
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.5.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.4
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/icones/
    - assets/imagens/
    - assets/fontes/inter/LICENSE.txt
    - assets/fontes/spline-sans-mono/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fontes/inter/Inter-Regular.ttf
        - asset: assets/fontes/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fontes/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fontes/inter/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fontes/inter/InterDisplay-Bold.ttf
          weight: 700
    - family: SplineSansMono
      fonts:
        - asset: assets/fontes/spline-sans-mono/SplineSansMono-500.ttf
          weight: 500
        - asset: assets/fontes/spline-sans-mono/SplineSansMono-600.ttf
          weight: 600
